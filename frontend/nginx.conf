# ---------------------------------------------------------------------------
# nginx configuration for the ResumeTailor-AI frontend container.
#
# Serves the built SPA and reverse-proxies every /api call to the backend
# service. Because both live behind the same origin, the browser sees a
# single host: no CORS preflight, and the relative `download_url`
# (/api/download/<file>.pdf) returned by the backend resolves without any
# rebuild or environment variable.
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The CV upload accepts up to 5 MB; leave headroom for the multipart
    # envelope and the base64 photo payload.
    client_max_body_size 20m;

    # --- API reverse proxy -------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Server-Sent Events: /api/generate streams progress events while the
        # LLM works. Buffering would hold the whole stream until the response
        # finished, so the progress bar would jump from 0 to 100 instead of
        # advancing step by step.
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_set_header   Connection "";

        # Generations take up to ~2 minutes on a slow model.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # FastAPI's interactive docs, for convenience.
    location /docs      { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /redoc     { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    # --- Static assets -----------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    # index.html must never be cached, otherwise a new deploy keeps serving
    # the old bundle references.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide the nginx version from the response headers.
    server_tokens off;
}
