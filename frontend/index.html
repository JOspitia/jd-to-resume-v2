<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Merriweather:wght@300;400;700;900&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Resume Matcher AI</title>
    <!--
      FOUC-prevention: read the persisted theme (or fall back to OS
      preference) and apply the `.dark` class to <html> BEFORE React
      mounts. Without this, users with `prefers-color-scheme: dark`
      would see a flash of light content on every page load.
      Mirrors the logic in useTheme.ts — keep the two in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          // localStorage may be unavailable (private mode); default to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
